name: Test

on:
  push:
    branches: 
      - main
      - renovate/**
      - dependabot/**
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  test_matrix:
    strategy:
      fail-fast: false
      matrix:
        # 18.12.0 is pinned to match Dockerfile/.nvmrc — the version actually shipped.
        node-version:
          - 18.12.0
          - 20
          - 22
          - 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm clean-install
      - run: npm run build
      - run: npm run test
  test:
    runs-on: ubuntu-latest
    needs: test_matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm clean-install
      - run: npm audit signatures
      - run: npm run lint
