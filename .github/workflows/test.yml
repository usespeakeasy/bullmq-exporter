name: Test

on:
  push:
    branches: 
      - main
      - renovate/**
      - dependabot/**
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  test_matrix:
    strategy:
      fail-fast: false
      matrix:
        # Non-EOL lines only. 24 is what Dockerfile/.nvmrc ship; 26 is pre-LTS forward coverage.
        node-version:
          - 22
          - 24
          - 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm clean-install
      - run: npm run build
      - run: npm run test
  test:
    runs-on: ubuntu-latest
    needs: test_matrix
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm clean-install
      - run: npm audit signatures
      - run: npm run lint
